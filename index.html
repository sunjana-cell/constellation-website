<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Constellation Sign In</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <main class="signin-page">
        <section class="signin-shell" aria-labelledby="signin-heading">
            <div class="signin-heading">
                <p class="eyebrow">THE NIGHT sun</p>
                <h1 id="signin-heading">Find your constellation</h1>
                <p>Enter the observatory and begin exploring the stories written in the stars.</p>
            </div>

            <form id="signinbox" class="signin-card" novalidate>
                <div class="field-group">
                    <label id="email-label" for="email">Email address</label>
                    <input id="email" type="email" placeholder="you@example.com" autocomplete="email" required>
                </div>

                <div class="field-group">
                    <label id="username-label" for="user">Username</label>
                    <input id="user" type="text" placeholder="Your star name" autocomplete="username" required>
                    <p id="usererror" class="form-error" aria-live="polite"></p>
                </div>

                <div class="field-group">
                    <label id="password-label" for="password">Password</label>
                    <input id="password" type="password" placeholder="At least 8 characters" autocomplete="current-password" required>
                    <p id="passerror" class="form-error" aria-live="polite"></p>
                </div>

                <button id="signinbtn" type="button">Enter observatory <span aria-hidden="true">→</span></button>
            </form>

            <p id="desk">Your constellation guide adapts beautifully to every screen.</p>
        </section>
    </main>

    <script src="script.js"></script>
</body>
</html>

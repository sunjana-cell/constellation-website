<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">

    <title>contellation sign in</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>

    <div class = "sign in">
            <h1>Sign In</h1>
    </div>

    <div class = "herohome">

         <form id="signinbox">

            <p id ="email-label"> enter you email</p>

            <input id ="email" type="email" placeholder = " Email " required ></input>


            <p id ="username-label"> enter you username</p>

            <input id ="user" type="text" placeholder = " Username " required></input>
            <p id="usererror"></p>

            <p id ="password-label"> enter you password</p>

            <input id ="password" type="password" placeholder = " Password " required></input>

                <i class="fa-light fa-eye"></i>

              <p id="passerror"></p>

        </form>
    </div>

    <div class = "button">
          <button id = "signinbtn">sign in</button>
    </div>
    <script src = "script.js"></script>
</body>
</html>
